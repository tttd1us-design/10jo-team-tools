<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1:1 면담 코치</title>
<style>
:root {
  --primary: #1e3a5f;
  --primary-light: #2c5282;
  --primary-dark: #152a45;
  --accent: #4a90a4;
  --bg: #f7f8fa;
  --card-bg: #ffffff;
  --text: #2d3748;
  --text-light: #718096;
  --border: #e2e8f0;
  --success: #38a169;
  --warning: #d69e2e;
  --danger: #e53e3e;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
}
header {
  text-align: center;
  padding: 30px 0 20px;
}
header h1 {
  color: var(--primary);
  font-size: 1.8rem;
  margin-bottom: 8px;
}
header p {
  color: var(--text-light);
  font-size: 0.95rem;
}
.notice {
  background: linear-gradient(135deg, #ebf4ff 0%, #e6fffa 100%);
  border-left: 4px solid var(--accent);
  padding: 14px 18px;
  border-radius: 8px;
  margin-bottom: 24px;
  font-size: 0.9rem;
  color: var(--primary-dark);
}
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.tab-btn {
  flex: 1;
  min-width: 120px;
  padding: 12px 16px;
  border: 2px solid var(--border);
  background: var(--card-bg);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-light);
  transition: all 0.2s;
}
.tab-btn:hover { border-color: var(--primary-light); color: var(--primary); }
.tab-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.card h2 {
  color: var(--primary);
  font-size: 1.2rem;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
}
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--primary-dark);
  font-size: 0.9rem;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 0.95rem;
  font-family: inherit;
  transition: border-color 0.2s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary-light);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.btn {
  display: inline-block;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: var(--primary-light); }
.btn-secondary {
  background: var(--border);
  color: var(--text);
}
.btn-secondary:hover { background: #cbd5e0; }
.btn-success {
  background: var(--success);
  color: white;
}
.btn-success:hover { background: #2f855a; }
.btn-block { width: 100%; }
.script-section {
  background: #f7fafc;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 14px;
  border-left: 4px solid var(--accent);
}
.script-section h3 {
  font-size: 0.85rem;
  color: var(--accent);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.script-section p {
  font-size: 0.95rem;
  color: var(--text);
  line-height: 1.7;
}
.response-card {
  background: #fff5f5;
  border: 1px solid #fed7d7;
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 12px;
}
.response-card .reaction {
  font-weight: 600;
  color: var(--danger);
  margin-bottom: 6px;
}
.response-card .suggestion {
  color: var(--text);
  font-size: 0.9rem;
}
.record-item {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
}
.record-item .record-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.record-item .record-title {
  font-weight: 600;
  color: var(--primary);
}
.record-item .record-date {
  font-size: 0.8rem;
  color: var(--text-light);
}
.record-item .record-body {
  font-size: 0.9rem;
  color: var(--text);
}
.record-item .agreement {
  background: #f0fff4;
  padding: 10px;
  border-radius: 6px;
  margin-top: 8px;
  font-size: 0.85rem;
}
.followup-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.followup-done { background: #c6f6d5; color: #22543d; }
.followup-pending { background: #fefcbf; color: #744210; }
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card-bg);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-card .number {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--primary);
}
.stat-card .label {
  font-size: 0.8rem;
  color: var(--text-light);
}
.checkbox-group {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.timeline {
  position: relative;
  padding-left: 24px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}
.timeline-item {
  position: relative;
  margin-bottom: 16px;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -20px;
  top: 6px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
}
.timeline-item .time {
  font-size: 0.75rem;
  color: var(--text-light);
}
.timeline-item .content {
  font-size: 0.9rem;
}
@media (max-width: 600px) {
  .container { padding: 12px; }
  header h1 { font-size: 1.4rem; }
  .card { padding: 16px; }
  .tab-btn { min-width: 100px; padding: 10px 12px; font-size: 0.85rem; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>1:1 면담 코치</h1>
    <p>어려운 대화를 준비하고, 구조를 개선하세요</p>
  </header>

  <div class="notice">
    <strong>이 대화는 비난이 아니라 구조 개선입니다.</strong><br>
    목표는 상대를 탓하는 것이 아니라, 함께 일하는 방식을 더 나은 방향으로 조정하는 것입니다.
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="prepare">면담 준비</button>
    <button class="tab-btn" data-tab="script">대화 스크립트</button>
    <button class="tab-btn" data-tab="response">예상 반응</button>
    <button class="tab-btn" data-tab="record">면담 기록</button>
    <button class="tab-btn" data-tab="followup">후속 추적</button>
  </div>

  <!-- 면담 준비 -->
  <div id="prepare" class="tab-content active">
    <div class="card">
      <h2>면담 대상 및 상황</h2>
      <div class="form-group">
        <label>직원 선택</label>
        <select id="employeeSelect">
          <option value="">-- 직원 선택 --</option>
        </select>
      </div>
      <div class="form-group">
        <label>새 직원 추가 (이름 또는 익명 ID)</label>
        <input type="text" id="newEmployee" placeholder="예: 김민수 또는 E-001">
        <button class="btn btn-secondary" onclick="addEmployee()" style="margin-top:8px;">추가</button>
      </div>
      <div class="form-group">
        <label>상황 입력</label>
        <textarea id="situation" placeholder="예: 위기 사례 개입 후 결과 미보고, 회의에서 발언 없음 등"></textarea>
      </div>
      <div class="form-group">
        <label>문제 유형</label>
        <select id="issueType">
          <option value="보고 부재">보고 부재</option>
          <option value="질문 부재">질문 부재</option>
          <option value="진행 파악 안 됨">진행 파악 안 됨</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" onclick="generateScript()">대화 스크립트 생성</button>
    </div>
  </div>

  <!-- 대화 스크립트 -->
  <div id="script" class="tab-content">
    <div class="card">
      <h2>생성된 대화 스크립트</h2>
      <div id="scriptOutput">
        <div class="empty-state">
          <div class="icon">📋</div>
          <p>면담 준비 탭에서 상황을 입력하고 스크립트를 생성하세요.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 예상 반응 -->
  <div id="response" class="tab-content">
    <div class="card">
      <h2>예상 반응 및 대응</h2>
      <div id="responseOutput">
        <div class="empty-state">
          <div class="icon">💬</div>
          <p>스크립트 생성 후 예상 반응을 확인하세요.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 면담 기록 -->
  <div id="record" class="tab-content">
    <div class="card">
      <h2>면담 기록 작성</h2>
      <div class="form-group">
        <label>날짜</label>
        <input type="date" id="recordDate">
      </div>
      <div class="form-group">
        <label>직원</label>
        <select id="recordEmployee"></select>
      </div>
      <div class="form-group">
        <label>면담 요약</label>
        <textarea id="recordSummary" placeholder="대화 내용을 간단히 요약하세요"></textarea>
      </div>
      <div class="form-group">
        <label>합의 사항</label>
        <textarea id="recordAgreement" placeholder="예: 매주 월요일 10분, 3줄 보고"></textarea>
      </div>
      <div class="form-group">
        <label>후속 조치</label>
        <textarea id="recordAction" placeholder="예: 2주 후 진행 상황 확인"></textarea>
      </div>
      <button class="btn btn-primary btn-block" onclick="saveRecord()">기록 저장</button>
    </div>
    <div class="card">
      <h2>기록된 면담</h2>
      <div id="recordList"></div>
    </div>
  </div>

  <!-- 후속 추적 -->
  <div id="followup" class="tab-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="totalCount">0</div>
        <div class="label">전체 면담</div>
      </div>
      <div class="stat-card">
        <div class="number" id="doneCount">0</div>
        <div class="label">합의 이행 완료</div>
      </div>
      <div class="stat-card">
        <div class="number" id="pendingCount">0</div>
        <div class="label">이행 대기</div>
      </div>
    </div>
    <div class="card">
      <h2>후속 추적 목록</h2>
      <div id="followupList"></div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'oneOnOneCoach';
let data = loadData();
let currentScript = null;

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try { return JSON.parse(saved); } catch(e) { return { employees: [], records: [] }; }
  }
  return { employees: [], records: [] };
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function addEmployee() {
  const input = document.getElementById('newEmployee');
  const name = input.value.trim();
  if (!name) { alert('이름 또는 ID를 입력하세요.'); return; }
  if (data.employees.includes(name)) { alert('이미 등록된 직원입니다.'); return; }
  data.employees.push(name);
  saveData();
  input.value = '';
  updateEmployeeSelects();
  alert('직원이 추가되었습니다.');
}

function updateEmployeeSelects() {
  const selects = ['employeeSelect', 'recordEmployee'];
  selects.forEach(id => {
    const sel = document.getElementById(id);
    const current = sel.value;
    sel.innerHTML = '<option value="">-- 직원 선택 --</option>';
    data.employees.forEach(emp => {
      const opt = document.createElement('option');
      opt.value = emp;
      opt.textContent = emp;
      sel.appendChild(opt);
    });
    sel.value = current;
  });
}

function generateScript() {
  const employee = document.getElementById('employeeSelect').value;
  const situation = document.getElementById('situation').value.trim();
  const issueType = document.getElementById('issueType').value;

  if (!employee) { alert('직원을 선택하세요.'); return; }
  if (!situation) { alert('상황을 입력하세요.'); return; }

  const script = buildScript(employee, situation, issueType);
  currentScript = script;
  renderScript(script);
  renderResponses(script);
  switchTab('script');
}

function buildScript(employee, situation, issueType) {
  const scripts = {
    '보고 부재': {
      intro: `"${employee}님, 요즘 어떻게 지내요? 바쁘시죠?"`,
      fact: `지난주 ${situation} 건에 대해 제가 먼저 여쭤봤어요.`,
      impact: `제가 진행 상황을 파악하지 못하면, 다른 팀원에게도 영향이 가고 의사결정이 늦어져요.`,
      request: `다음 주부터 매주 월요일 10분, 3줄로 알려줄 수 있어요?`,
      support: `어려우면 언제든 말해요. 함께 해결할 방법을 찾아볼게요.`
    },
    '질문 부재': {
      intro: `"${employee}님, 최근 업무는 어떤가요? 궁금한 점은 없으세요?"`,
      fact: `최근 ${situation} 상황에서 질문이나 확인 요청이 없었어요.`,
      impact: `질문이 없으면 제가 진행 방향이 맞는지 확인하기 어려워요.`,
      request: `다음 주부터 작은 것이라도 이해가 안 되는 부분이 있으면 바로 물어봐 줄 수 있어요?`,
      support: `질문하는 것이 부담스럽지 않도록, 편하게 말할 수 있는 분위기를 만들게요.`
    },
    '진행 파악 안 됨': {
      intro: `"${employee}님, 요즘 일정은 어떻게 되어가고 있어요?"`,
      fact: `${situation} 건의 진행 상황을 제가 파악하지 못하고 있어요.`,
      impact: `진행 상황이 보이지 않으면 우선순위 조정이나 지원을 제때 드리기 어려워요.`,
      request: `다음 주부터 매주 수요일, 간단한 진행 보고를 공유해 줄 수 있어요?`,
      support: `보고가 부담스럽지 않도록 간단한 양식을 만들어 드릴게요.`
    },
    '기타': {
      intro: `"${employee}님, 요즘 어떻게 지내요?"`,
      fact: `${situation} 상황에 대해 이야기하고 싶어요.`,
      impact: `이 부분이 해결되지 않으면 팀 전체의 효율에 영향이 갈 수 있어요.`,
      request: `다음 주부터 이 부분에 대해 함께 개선 방안을 찾아볼 수 있을까요?`,
      support: `어려운 부분이 있으면 언제든 말씀해 주세요.`
    }
  };

  return scripts[issueType] || scripts['기타'];
}

function renderScript(script) {
  const output = document.getElementById('scriptOutput');
  output.innerHTML = `
    <div class="script-section">
      <h3>1. 도입 (비난 없는 시작)</h3>
      <p>${script.intro}</p>
    </div>
    <div class="script-section">
      <h3>2. 사실 진술</h3>
      <p>${script.fact}</p>
    </div>
    <div class="script-section">
      <h3>3. 영향 설명</h3>
      <p>${script.impact}</p>
    </div>
    <div class="script-section">
      <h3>4. 구체적 요청</h3>
      <p>${script.request}</p>
    </div>
    <div class="script-section">
      <h3>5. 지지 표현</h3>
      <p>${script.support}</p>
    </div>
  `;
}

function renderResponses(script) {
  const output = document.getElementById('responseOutput');
  const responses = [
    {
      reaction: '"바빠서요"',
      suggestion: `"바쁘신 거 알아요. 그래서 더 간단하게 만들려고 해요. 3줄이면 1분이면 돼요. 이 정도는 가능할까요?"`
    },
    {
      reaction: '"몰랐어요"',
      suggestion: `"몰랐을 수 있어요. 제가 더 명확하게 전달하지 못한 부분이 있었어요. 이제부터는 이렇게 알려드릴게요."`
    },
    {
      reaction: '"네, 알겠어요"',
      suggestion: `"고마워요. 그럼 다음 주부터 시작해볼까요? 혹시 어려운 부분이 있으면 바로 말해줘요."`
    },
    {
      reaction: '"왜 이제야 말해요?"',
      suggestion: `"말씀하신 대로 미리 이야기했어야 했어요. 죄송해요. 앞으로는 더 일찍 공유할게요."`
    },
    {
      reaction: '"다른 팀원도 그래요"',
      suggestion: `"다른 팀원 이야기는 나중에 따로 확인할게요. 지금은 ${document.getElementById('employeeSelect').value}님과 함께 더 나은 방법을 찾고 싶어요."`
    }
  ];

  output.innerHTML = responses.map(r => `
    <div class="response-card">
      <div class="reaction">예상 반응: ${r.reaction}</div>
      <div class="suggestion">대응: ${r.suggestion}</div>
    </div>
  `).join('');
}

function saveRecord() {
  const date = document.getElementById('recordDate').value;
  const employee = document.getElementById('recordEmployee').value;
  const summary = document.getElementById('recordSummary').value.trim();
  const agreement = document.getElementById('recordAgreement').value.trim();
  const action = document.getElementById('recordAction').value.trim();

  if (!date || !employee || !summary) { alert('날짜, 직원, 요약은 필수입니다.'); return; }

  const record = {
    id: Date.now(),
    date,
    employee,
    summary,
    agreement,
    action,
    followupDone: false,
    createdAt: new Date().toISOString()
  };

  data.records.push(record);
  saveData();
  renderRecords();
  renderFollowups();
  alert('기록이 저장되었습니다.');
}

function renderRecords() {
  const list = document.getElementById('recordList');
  if (data.records.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>아직 기록된 면담이 없습니다.</p></div>';
    return;
  }
  const sorted = [...data.records].sort((a, b) => new Date(b.date) - new Date(a.date));
  list.innerHTML = sorted.map(r => `
    <div class="record-item">
      <div class="record-header">
        <span class="record-title">${r.employee}</span>
        <span class="record-date">${r.date}</span>
      </div>
      <div class="record-body">${r.summary}</div>
      ${r.agreement ? `<div class="agreement"><strong>합의:</strong> ${r.agreement}</div>` : ''}
      ${r.action ? `<div class="agreement"><strong>후속:</strong> ${r.action}</div>` : ''}
    </div>
  `).join('');
}

function renderFollowups() {
  const list = document.getElementById('followupList');
  const total = data.records.length;
  const done = data.records.filter(r => r.followupDone).length;
  const pending = total - done;

  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('pendingCount').textContent = pending;

  if (data.records.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>추적할 면담이 없습니다.</p></div>';
    return;
  }

  const sorted = [...data.records].sort((a, b) => new Date(b.date) - new Date(a.date));
  list.innerHTML = sorted.map(r => `
    <div class="record-item">
      <div class="record-header">
        <span class="record-title">${r.employee}</span>
        <span class="followup-badge ${r.followupDone ? 'followup-done' : 'followup-pending'}">
          ${r.followupDone ? '이행 완료' : '이행 대기'}
        </span>
      </div>
      <div class="record-body">${r.summary}</div>
      ${r.agreement ? `<div class="agreement"><strong>합의 사항:</strong> ${r.agreement}</div>` : ''}
      <div style="margin-top:10px;">
        <button class="btn ${r.followupDone ? 'btn-secondary' : 'btn-success'}" onclick="toggleFollowup(${r.id})">
          ${r.followupDone ? '미완료로 변경' : '이행 완료 체크'}
        </button>
        <button class="btn btn-secondary" onclick="deleteRecord(${r.id})" style="margin-left:8px;">삭제</button>
      </div>
    </div>
  `).join('');
}

function toggleFollowup(id) {
  const record = data.records.find(r => r.id === id);
  if (record) {
    record.followupDone = !record.followupDone;
    saveData();
    renderFollowups();
  }
}

function deleteRecord(id) {
  if (!confirm('이 기록을 삭제하시겠습니까?')) return;
  data.records = data.records.filter(r => r.id !== id);
  saveData();
  renderRecords();
  renderFollowups();
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tabName);
  });
  document.querySelectorAll('.tab-content').forEach(content => {
    content.classList.toggle('active', content.id === tabName);
  });
}

// 탭 이벤트
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// 초기화
document.addEventListener('DOMContentLoaded', () => {
  updateEmployeeSelects();
  renderRecords();
  renderFollowups();
  document.getElementById('recordDate').valueAsDate = new Date();
});
</script>
</body>
</html>
