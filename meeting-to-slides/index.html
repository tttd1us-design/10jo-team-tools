<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의메모 → 발표자료 변환기</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; font-size: 1.8em; }
.input-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
textarea { width: 100%; min-height: 200px; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; resize: vertical; font-family: inherit; }
textarea:focus { outline: none; border-color: #9b59b6; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
.btn-primary { background: #9b59b6; color: #fff; }
.btn-primary:hover { background: #8e44ad; }
.btn-secondary { background: #3498db; color: #fff; }
.btn-secondary:hover { background: #2980b9; }
.btn-success { background: #27ae60; color: #fff; }
.btn-success:hover { background: #219a52; }
.btn-group { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.slider-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.slider-section label { display: block; margin-bottom: 8px; font-weight: 600; }
input[type="range"] { width: 100%; margin-bottom: 10px; }
.slide-count { text-align: center; font-size: 1.2em; font-weight: 700; color: #9b59b6; }
.preview-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.preview-section h2 { margin-bottom: 15px; color: #2c3e50; }
.slide { background: #f8f9fa; border-left: 4px solid #9b59b6; padding: 15px; margin-bottom: 12px; border-radius: 0 8px 8px 0; }
.slide-title { font-size: 1.1em; font-weight: 700; color: #2c3e50; margin-bottom: 8px; }
.slide-bullets { list-style: none; padding-left: 0; }
.slide-bullets li { padding: 4px 0 4px 20px; position: relative; font-size: 14px; }
.slide-bullets li::before { content: "•"; position: absolute; left: 5px; color: #9b59b6; font-weight: bold; }
.slide-type { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-weight: 600; }
.type-title { background: #e8daef; color: #7d3c98; }
.type-content { background: #d4efdf; color: #1e8449; }
.type-decision { background: #fdebd0; color: #d68910; }
.type-conclusion { background: #d6eaf8; color: #2471a3; }
.export-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.export-section h2 { margin-bottom: 15px; color: #2c3e50; }
.export-output { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
.empty-state { text-align: center; padding: 40px; color: #95a5a6; }
@media (max-width: 600px) { .container { padding: 10px; } h1 { font-size: 1.4em; } .btn-group { flex-direction: column; } .btn { width: 100%; } }
</style>
</head>
<body>
<div class="container">
<h1>📊 회의메모 → 발표자료 변환기</h1>

<div class="input-section">
<textarea id="memoInput" placeholder="회의 메모를 붙여넣으세요.&#10;&#10;예:&#10;Q4 마케팅 전략 회의&#10;일시: 2026년 10월 5일&#10;참석자: 김이사, 박과장, 최대리&#10;&#10;1. 예산 배분 논의&#10;- 디지털 광고 예산 30% 증액 결정&#10;- SNS 채널 확대&#10;&#10;2. 일정 조정&#10;- 11월 중순 캠페인 시작으로 변경&#10;&#10;결정사항: 예산 30% 증액, 11월 중순 시작"></textarea>
<div class="btn-group">
<button class="btn btn-primary" onclick="analyzeAndGenerate()">분석 & 생성</button>
<button class="btn btn-secondary" onclick="clearAll()">초기화</button>
</div>
</div>

<div class="slider-section" id="sliderSection" style="display:none;">
<label>슬라이드 수 조절</label>
<input type="range" id="slideCount" min="5" max="15" value="10" step="5" onchange="updateSlideCount()">
<div class="slide-count" id="slideCountDisplay">10장</div>
</div>

<div class="preview-section" id="previewSection" style="display:none;">
<h2>📋 슬라이드 미리보기</h2>
<div id="slidesContainer"></div>
</div>

<div class="export-section" id="exportSection" style="display:none;">
<h2>📤 내보내기</h2>
<div class="btn-group" style="margin-bottom: 15px;">
<button class="btn btn-success" onclick="exportMarkdown()">마크다운</button>
<button class="btn btn-success" onclick="exportText()">텍스트</button>
<button class="btn btn-secondary" onclick="copyToClipboard()">클립보드 복사</button>
</div>
<div class="export-output" id="exportOutput"></div>
</div>
</div>

<script>
let currentSlides = [];
let currentFormat = 'markdown';

function analyzeAndGenerate() {
const memo = document.getElementById('memoInput').value.trim();
if (!memo) { alert('회의 메모를 입력해주세요.'); return; }

const slides = parseMemoToSlides(memo);
currentSlides = slides;
document.getElementById('sliderSection').style.display = 'block';
document.getElementById('previewSection').style.display = 'block';
document.getElementById('exportSection').style.display = 'block';
renderSlides();
updateSlideCount();
}

function parseMemoToSlides(memo) {
const lines = memo.split('\n').map(l => l.trim()).filter(l => l);
const slides = [];

// 제목 후보 추출 (첫 번째 줄 또는 가장 긴 줄)
let title = lines[0] || '회의 제목';
const titleCandidates = lines.filter(l => l.length > 5 && l.length < 50);
if (titleCandidates.length > 0) {
// 숫자나 특수문자가 적은 줄을 제목으로
title = titleCandidates.find(l => !/^\d/.test(l) && !l.includes(':')) || titleCandidates[0];
}

// 결정사항 분리
const decisionKeywords = ['결정', '결정사항', '합의', '확정', '최종'];
const decisions = [];
const contentLines = [];
let inDecisionSection = false;

lines.forEach(line => {
const isDecisionHeader = decisionKeywords.some(k => line.includes(k));
if (isDecisionHeader) { inDecisionSection = true; return; }
if (inDecisionSection && line) {
decisions.push(line.replace(/^[-•*]\s*/, ''));
} else if (!isDecisionHeader) {
contentLines.push(line);
}
});

// 섹션 분리 (숫자로 시작하는 줄 = 새 섹션)
const sections = [];
let currentSection = null;
contentLines.forEach(line => {
const sectionMatch = line.match(/^(\d+)[.、]\s*(.+)/);
if (sectionMatch) {
if (currentSection) sections.push(currentSection);
currentSection = { title: sectionMatch[2], bullets: [] };
} else if (currentSection && line) {
currentSection.bullets.push(line.replace(/^[-•*]\s*/, ''));
} else if (!currentSection && line && line !== title) {
// 첫 번째 섹션 전의 내용
currentSection = { title: '개요', bullets: [line] };
}
});
if (currentSection) sections.push(currentSection);

// 슬라이드 생성
// 1. 타이틀 슬라이드
slides.push({ type: 'title', title: title, bullets: [] });

// 2. 아젠다 슬라이드
if (sections.length > 0) {
slides.push({ type: 'content', title: '아젠다', bullets: sections.map(s => s.title) });
}

// 3. 본문 슬라이드들
sections.forEach(section => {
if (section.bullets.length > 0) {
slides.push({ type: 'content', title: section.title, bullets: section.bullets });
} else {
slides.push({ type: 'content', title: section.title, bullets: ['(내용 없음)'] });
}
});

// 4. 결정사항 슬라이드
if (decisions.length > 0) {
slides.push({ type: 'decision', title: '결정사항', bullets: decisions });
}

// 5. 마무리 슬라이드
slides.push({ type: 'conclusion', title: '다음 단계', bullets: ['액션 아이템 확인', '담당자 지정', '일정 조율'] });

return slides;
}

function renderSlides() {
const container = document.getElementById('slidesContainer');
const maxSlides = parseInt(document.getElementById('slideCount').value);
const displaySlides = currentSlides.slice(0, maxSlides);

container.innerHTML = displaySlides.map((slide, i) => `
<div class="slide">
<div class="slide-title">${i + 1}. ${escapeHtml(slide.title)}<span class="slide-type type-${slide.type}">${getTypeLabel(slide.type)}</span></div>
${slide.bullets.length > 0 ? `<ul class="slide-bullets">${slide.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join('')}</ul>` : ''}
</div>
`).join('');
}

function getTypeLabel(type) {
const labels = { title: '제목', content: '본문', decision: '결정', conclusion: '마무리' };
return labels[type] || type;
}

function updateSlideCount() {
const count = document.getElementById('slideCount').value;
document.getElementById('slideCountDisplay').textContent = count + '장';
renderSlides();
}

function exportMarkdown() {
currentFormat = 'markdown';
const maxSlides = parseInt(document.getElementById('slideCount').value);
const displaySlides = currentSlides.slice(0, maxSlides);
let md = '# ' + (displaySlides[0]?.title || '발표') + '\n\n';
displaySlides.forEach((slide, i) => {
if (i === 0) return; // 타이틀은 이미 위에
md += `## ${i}. ${slide.title}\n`;
slide.bullets.forEach(b => { md += `- ${b}\n`; });
md += '\n';
});
document.getElementById('exportOutput').textContent = md;
}

function exportText() {
currentFormat = 'text';
const maxSlides = parseInt(document.getElementById('slideCount').value);
const displaySlides = currentSlides.slice(0, maxSlides);
let txt = '';
displaySlides.forEach((slide, i) => {
txt += `[${i + 1}] ${slide.title}\n`;
slide.bullets.forEach(b => { txt += `  - ${b}\n`; });
txt += '\n';
});
document.getElementById('exportOutput').textContent = txt;
}

function copyToClipboard() {
const text = document.getElementById('exportOutput').textContent;
if (!text) { alert('내보낼 내용이 없습니다. 먼저 마크다운 또는 텍스트를 생성해주세요.'); return; }
navigator.clipboard.writeText(text).then(() => {
alert('클립보드에 복사되었습니다!');
}).catch(() => {
// Fallback
const textarea = document.createElement('textarea');
textarea.value = text;
document.body.appendChild(textarea);
textarea.select();
document.execCommand('copy');
document.body.removeChild(textarea);
alert('클립보드에 복사되었습니다!');
});
}

function clearAll() {
document.getElementById('memoInput').value = '';
document.getElementById('sliderSection').style.display = 'none';
document.getElementById('previewSection').style.display = 'none';
document.getElementById('exportSection').style.display = 'none';
currentSlides = [];
}

function escapeHtml(text) {
const div = document.createElement('div');
div.textContent = text;
return div.innerHTML;
}
</script>
</body>
</html>
